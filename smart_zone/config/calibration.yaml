# SYNTHETIC calibration (not from a real click-and-measure session).
# The previous saved calibration mapped nearly the whole frame height to a
# 0.16m x 0.16m world square (almost certainly a stale/test run), which made
# every projected worker position cramped into an ~16cm patch. This
# synthetic calibration instead assumes a plausible webcam setup -- roughly
# chest-height, looking slightly down at a few meters of floor -- and maps a
# trapezoid in the image (perspective: near edge wide/low, far edge
# narrow/higher) to a real 3m-wide x 3m-deep rectangle of floor starting 1m
# in front of the camera. It produces reasonable-looking ground-plane
# geometry for demos, but is NOT metrically accurate to any real room.
# Replace by running `python -m smart_zone.spatial.calibration` for real
# click-and-measure calibration before field use.
camera:
  intrinsics: null
  extrinsics: null
homography:
  matrix:
  - - -0.22499999999999593
    - 0.0
    - 215.99999999999605
  - - 0.0
    - 0.2599999999999951
    - -358.9999999999933
  - - 0.0
    - -0.09999999999999813
    - 1.0
  ground_plane_points_image:
  - - 300.0
    - 1000.0
  - - 1620.0
    - 1000.0
  - - 1200.0
    - 550.0
  - - 720.0
    - 550.0
  ground_plane_points_world:
  - - -1.5
    - 1.0
  - - 1.5
    - 1.0
  - - 1.0
    - 4.0
  - - -1.0
    - 4.0
